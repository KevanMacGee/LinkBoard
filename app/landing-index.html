<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkBoard — Landing</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="landing.css">
    <!--
    <style>
      /* ============================================================= */
      /* ===================== HERO-ONLY CSS START ==================== */

      /* ============================================================= */
      </style>
    -->
  </head>
  <body>
    <header>
      <div class="bar">
        <div style="display: flex; align-items: center; gap: 12px">
          <h1>
            <span class="dot"></span> LinkBoard
          </h1>
        </div>
        <div></div>
        <div class="actions" style="justify-content: flex-end">
          <button id="btnTheme" title="Toggle dark/light">🌙 Dark</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-left">
          <h1 id="hero-title">Keep and organize web links</h1>
          <p class="hint">
            Keep your bookmarks organized. Drag to arrange, filter instantly, <br>and store everything locally. Export anytime.
          </p>
          <div class="actions">
            <button type="button" onclick="location.href='index.html'">Open the app</button>
            <button type="button" onclick="location.href='#learn'">Learn more →</button>
          </div>
        </div>
        <div class="hero-right">
          <img alt="LinkBoard preview" src="../screenshots/Screenshot%202025-11-02%20233701.png" />
        </div>
      </section>
    </main>

    <script>
      // ——— Theme ———
      const THEME_KEY = "linkboard.theme";
      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        const b = document.getElementById("btnTheme");
        if (b) {
          b.textContent = theme === "dark" ? "☀️ Light" : "🌙 Dark";
        }
      }
      (function initTheme() {
        let saved = localStorage.getItem(THEME_KEY);
        if (!saved) {
          const mql = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
          saved = mql && mql.matches ? "dark" : "light";
        }
        applyTheme(saved);
        const btn = document.getElementById("btnTheme");
        if (btn) {
          btn.addEventListener("click", () => {
            const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
            try {
              localStorage.setItem(THEME_KEY, cur);
            } catch (e) {
              console.warn('Theme preference could not be saved:', e);
            }
            applyTheme(cur);
          });
        }
      })();
    </script>
  </body>
</html>
